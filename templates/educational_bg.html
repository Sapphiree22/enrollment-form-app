<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form</title>
    <link rel="stylesheet" href="css/enrollment-form.css">
    <link rel="stylesheet" href="css/educational_bg.css">
</head>
<body>

<header class="enrollment-header">
    <h2>Student Enrollment Form</h2>
</header>

<div class="step-indicator">
    Step 2 out of 4: Educational Background
</div>

<div class="form-container">

    <!-- Step Progress -->
    <div class="steps">
        <a href="personaldetails.html" class="step-btn">Personal Data</a>
        <span class="arrow">→</span>
        <a href="educational_bg.html" class="step-btn active">Educational Background</a>
        <span class="arrow">→</span>
        <a href="course-detail.html" class="step-btn">Course Detail</a>
        <span class="arrow">→</span>
        <a href="upload_requirements.html" class="step-btn">Upload Requirements</a>
    </div>

    <form id="eduForm" onsubmit="return validateEduForm()">

        <div class="first-gen">
            <label>Are you a first generation student?</label> 
            <label><input type="radio" name="first_gen" value="yes" required> Yes</label>
            <label><input type="radio" name="first_gen" value="no" required> No</label>
        </div>

        <hr class="form-divider">

        <!-- Educational Background Rows -->
        <label class="school-label">Schools</label>

        <!-- Elementary -->
        <input type="text" id="elementary" name="elementary" placeholder="Elementary" required>
        <input type="text" id="elem_year" name="elem_year" placeholder="Academic Year" required>
        <input type="text" id="elem_honors" name="elem_honors" placeholder="Honors Received" required>

        <!-- High School -->
        <input type="text" id="highschool" name="highschool" placeholder="High School" required>
        <input type="text" id="hs_year" name="hs_year" placeholder="Academic Year" required>
        <input type="text" id="hs_honors" name="hs_honors" placeholder="Honors Received" required>

        <!-- College -->
        <input type="text" id="college" name="college" placeholder="College" required>
        <input type="text" id="college_year" name="college_year" placeholder="Academic Year" required>
        <input type="text" id="college_honors" name="college_honors" placeholder="Honors Received" required>

        <hr class="form-divider">

        <!-- Buttons -->
        <div class="button-row">
            <button type="submit" class="next">Next</button>
            <button type="button" class="cancel" onclick="window.location.href='personaldetails.html'">Cancel</button>
        </div>
    </form>
</div>

<script>
function validateEduForm() {
    const textPattern = /^[A-Za-z\s]+$/; // Letters and spaces only

    const fields = [
        { id: "elementary", label: "Elementary School" },
        { id: "elem_year", label: "Elementary Academic Year" },
        { id: "elem_honors", label: "Elementary Honors" },
        { id: "highschool", label: "High School" },
        { id: "hs_year", label: "High School Academic Year" },
        { id: "hs_honors", label: "High School Honors" },
        { id: "college", label: "College" },
        { id: "college_year", label: "College Academic Year" },
        { id: "college_honors", label: "College Honors" }
    ];

    for (let field of fields) {
        const value = document.getElementById(field.id).value.trim();

        // Check if empty
        if (value === "") {
            alert(`${field.label} cannot be empty.`);
            document.getElementById(field.id).focus();
            return false;
        }

        // Validate only for text fields (no numbers/special chars)
        if ((field.id.includes("honors") || field.id === "elementary" || field.id === "highschool" || field.id === "college") 
            && !textPattern.test(value)) {
            alert(`${field.label} must not contain numbers or special characters.`);
            document.getElementById(field.id).focus();
            return false;
        }
    }

    // ✅ If validation passes, go to next page
    window.location.href = "course-detail.html";
    return false; // Prevent actual form submission
}
</script>

<footer>
    &copy; 2025 Enrollment Form | Group 2
</footer>

</body>
</html>
